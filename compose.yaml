services:
  app:
    profiles: [server]
    build:
      context: ./backend
    environment:
      RUST_LOG: ${RUST_LOG}
    ports:
      - "${API_PORT}:3000"
    restart: unless-stopped

  typedb:
    profiles: [storage]
    image: typedb/typedb:3.12.2
    ports:
      - "${TYPEDB_GRPC_PORT}:1729"
      - "${TYPEDB_HTTP_PORT}:8000"
    volumes:
      - typedb_data:/var/lib/typedb/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1729'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres:
    profiles: [server]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/crates/core/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  garage:
    profiles: [storage]
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET}
    ports:
      - "${GARAGE_S3_PORT}:3900"
      - "${GARAGE_ADMIN_PORT}:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  grobid:
    profiles: [server]
    image: grobid/grobid:0.9.0-crf
    init: true
    ulimits:
      core:
        soft: 0
        hard: 0
    ports:
      - "${GROBID_PORT}:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8070/api/isalive | grep --quiet true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  restate:
    profiles: [server]
    image: docker.restate.dev/restatedev/restate:1.7.2
    command: ["--node-name=restate-1"]
    ports:
      - "${RESTATE_INGRESS_PORT}:8080"
      - "${RESTATE_ADMIN_PORT}:9070"
      - "${RESTATE_FABRIC_PORT}:5122"
    volumes:
      - restate_data:/restate-data
    healthcheck:
      test: ["CMD", "restatectl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  garage_data:
  garage_meta:
  postgres_data:
  restate_data:
  typedb_data:
