services:
  app:
    build:
      context: ./backend
      target: development
    environment:
      RUST_LOG: ${RUST_LOG:-scepa=debug}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TYPEDB_ADDRESS: typedb:1729
      TYPEDB_DATABASE: ${TYPEDB_DATABASE}
      TYPEDB_USERNAME: ${TYPEDB_USERNAME}
      TYPEDB_PASSWORD: ${TYPEDB_PASSWORD}
      QDRANT_URL: http://qdrant:6334
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-scepa}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-4096}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENAI_HOST: ${OPENAI_HOST:-https://api.tokenfactory.nebius.com/v1/}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-4}
      GROBID_URL: http://grobid:8070
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_REGION: ${GARAGE_REGION}
      GARAGE_BUCKET: ${GARAGE_BUCKET}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_ADMIN_URL: http://restate:9070
      RESTATE_DEPLOYMENT_URL: http://app:9080
      RESTATE_ENDPOINT_ADDRESS: 0.0.0.0:9080
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    depends_on:
      garage:
        condition: service_healthy
      grobid:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      restate:
        condition: service_healthy
      typedb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://app:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
    restart: unless-stopped

  typedb:
    image: typedb/typedb:3.12.2
    ports:
      - "${TYPEDB_GRPC_PORT}:1729"
      - "${TYPEDB_HTTP_PORT}:8000"
    volumes:
      - typedb_data:/var/lib/typedb/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1729'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/crates/core/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6334'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET}
    ports:
      - "${GARAGE_S3_PORT}:3900"
      - "${GARAGE_ADMIN_PORT}:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  grobid:
    image: grobid/grobid:0.9.0-crf
    init: true
    ulimits:
      core:
        soft: 0
        hard: 0
    ports:
      - "${GROBID_PORT}:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8070/api/isalive | grep --quiet true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  restate:
    image: docker.restate.dev/restatedev/restate:1.7.2
    command: ["--node-name=restate-1"]
    ports:
      - "${RESTATE_INGRESS_PORT}:8080"
      - "${RESTATE_ADMIN_PORT}:9070"
      - "${RESTATE_FABRIC_PORT}:5122"
    volumes:
      - restate_data:/restate-data
    healthcheck:
      test: ["CMD", "restatectl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  backend_target:
  cargo_git:
  cargo_registry:
  frontend_node_modules:
  garage_data:
  garage_meta:
  postgres_data:
  qdrant_data:
  restate_data:
  typedb_data:
