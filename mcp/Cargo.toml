[package]
name = "scepa-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.4"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.32"
hf-hub = "0.4.3"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
qdrant-client = "1.19.0"
reqwest = { version = "0.13.4", features = ["json"] }
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1.0.4", features = ["chrono04"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
tokenizers = { version = "0.22.1", default-features = false, features = ["onig", "progressbar"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
typedb-driver = "3.12.3"
